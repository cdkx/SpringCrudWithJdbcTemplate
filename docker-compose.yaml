services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U library -d library" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/library
      DB_USERNAME: library
      DB_PASSWORD: library
      SERVER_PORT: 8080
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_JDBCTEMPLATE: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_STATEMENTCREATORUTILS: TRACE
      LOGGING_LEVEL_RU_EREMIN: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library-network

volumes:
  library_pgdata:

networks:
  library-network:
    driver: bridge
